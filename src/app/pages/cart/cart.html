<div class="cart-container">
  <h1>Your Cart</h1>

  @if (error()) {
    <p class="error">Could not load cart.</p>
  }

  <div class="cart-items">
    @for (item of items(); track item.product.id) {
      <div class="cart-item">
        <img [src]="item.product.image" [alt]="item.product.name" />
        <div class="item-info">
          <h3>{{ item.product.name }}</h3>
          <p>Price: {{ item.product.price | currency }}</p>
          <div class="quantity-controls">
            <button
              (click)="
                updateQuantity(item.product.id, item.product.price, (item.quantity || 1) - 1)
              "
            >
              -
            </button>
            <span>{{ item.quantity || 1 }}</span>
            <button
              (click)="
                updateQuantity(item.product.id, item.product.price, (item.quantity || 1) + 1)
              "
            >
              +
            </button>
          </div>
        </div>
        <button class="delete-btn" (click)="delete(item.product.id)">Remove</button>
      </div>
    } @empty {
      <p class="empty">Your cart is empty.</p>
    }
  </div>

  @if (items().length > 0) {
    <div class="cart-total">
      <span>Total:</span>
      <span>{{ total | currency }}</span>
    </div>
  }
</div>
