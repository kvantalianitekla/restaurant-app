<div class="auth-container">
  <form class="auth-form" #signInForm="ngForm" (ngSubmit)="onSubmit()">
    <h2>Welcome Back</h2>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="formData.email"
        required
        email
        #emailRef="ngModel"
        placeholder="Enter your email"
      />
      @if (emailRef.invalid && emailRef.touched) {
        <span class="error">Valid email is required</span>
      }
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          [(ngModel)]="formData.password"
          required
          #passwordRef="ngModel"
          placeholder="Enter your password"
        />
        <button type="button" class="toggle-btn" (click)="showPassword.set(!showPassword())">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (passwordRef.invalid && passwordRef.touched) {
        <span class="error">Password is required</span>
      }
    </div>

    @if (errorMessage) {
      <span class="error">{{ errorMessage }}</span>
    }

    <button type="submit" [disabled]="signInForm.invalid">Sign In</button>

    <p>Don't have an account? <a routerLink="/sign-up">Sign Up</a></p>
  </form>
</div>
